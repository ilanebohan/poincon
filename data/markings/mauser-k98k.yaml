# Manufacturer codes stamped on the receiver of the Mauser Karabiner 98k.
#
# Every entry below is derived from the manufacturer labels of the French RGA
# (export of 2026-09-11). Nothing here has been checked against a printed
# reference yet: `period` stays empty until someone documents it with a source.
# `relatedRgaManufacturers` is an editorial grouping of labels that name the
# same maker; it is there to warn about near-identical RGA records.
#
# Fields
#   code                     what is stamped on the receiver, lower case
#   manufacturer / location  readable name of the maker and its site
#   country                  ISO 3166-1 alpha-2 code of the maker's country today
#   rgaManufacturers         exact RGA "fabricant" labels that carry this code
#   relatedRgaManufacturers  RGA labels for the same maker without the code
#   period                   years the code was in use, e.g. "1941-1945" (optional)
#   sources                  ids declared in the `sources` section

model:
